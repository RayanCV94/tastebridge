name: Tendances du jour
# Met à jour tendances.json (Wikipédia, SteamSpy) chaque jour et republie docs/ si quelque chose a changé.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tendances:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tendances.py
      - name: Discussions Reddit (ignoré sans les secrets REDDIT_CLIENT_ID et REDDIT_CLIENT_SECRET)
        run: python communaute.py
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      - run: python site.py
      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tendances.json docs/ $(ls communaute.json 2>/dev/null)
          git diff --cached --quiet || (git commit -m "Tendances du $(date -u +%F)" && git push)
