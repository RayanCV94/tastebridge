:root{
 --fond:#000000;--surface:#181818;--surface2:#1F1F1F;--trait:#272727;--trait2:#313131;
 --texte:#F2F2F2;--doux:#B4B4B4;--pale:#9B9B9B;
 --ambre:#E8A33D;--violet:#A99BF0;--menthe:#5CC9A0;--rouge:#E5706B;--bleu:#7FB0EA;
 --dom:var(--ambre);
 --ombre:0 18px 40px -14px color-mix(in srgb,var(--noir) 70%,transparent),0 2px 6px color-mix(in srgb,var(--noir) 35%,transparent);
 --sortie:cubic-bezier(.22,1,.36,1);
 --marge:clamp(16px,4vw,48px);

 --noir:#000000;--blanc:#FFFFFF;--texte2:#DADADA;--pale2:#8A8A8A;--surface0:#131209;--surface3:#272727;--encre:#131209;
 --ombre:0 24px 48px -24px rgb(19 18 9 / .8);
 --r:12px;--r-petit:8px;
 --t-hero:clamp(40px,6vw,72px);--t-page:clamp(36px,4.5vw,60px);--t-page-long:clamp(30px,3.6vw,48px);--t-section:clamp(24px,2.4vw,30px);
 --f-titre:Geist,ui-sans-serif,system-ui,sans-serif;--f-texte:Geist,ui-sans-serif,system-ui,sans-serif;
}
main.serie{--dom:var(--violet)} main.jeu{--dom:var(--menthe)}
*{box-sizing:border-box}
html,body{overflow-x:clip}
[hidden]{display:none!important}
html{scrollbar-color:var(--trait2) var(--fond);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--fond);color:var(--texte);font:16px/1.55 var(--f-texte);caret-color:var(--ambre);display:flex;flex-direction:column}
::selection{background:color-mix(in srgb,var(--ambre) 38%,transparent);color:var(--blanc)}
::-webkit-scrollbar{width:10px;height:8px} ::-webkit-scrollbar-track{background:transparent} ::-webkit-scrollbar-thumb{background:var(--trait2);border-radius:var(--r);border:2px solid var(--fond)}
:focus-visible{outline:2px solid var(--ambre);outline-offset:3px;border-radius:var(--r)}
a{color:inherit;text-underline-offset:3px}
button{font-family:inherit}
svg{flex:none}

/* En-tête */
header{position:sticky;top:0;z-index:20;background:linear-gradient(var(--fond),var(--fond));border-bottom:1px solid color-mix(in srgb,var(--texte) 6%,transparent)}
.barre{max-width:1480px;margin:auto;padding:13px var(--marge);display:flex;align-items:center;gap:28px}
.logo{display:flex;align-items:center;gap:10px;font:600 24px/1 var(--f-titre);letter-spacing:-.01em;text-decoration:none;color:var(--texte);white-space:nowrap}
.logo b{display:grid;place-items:center;width:32px;height:32px;border-radius:var(--r);background:var(--ambre);color:var(--fond)}
.logo b svg{width:20px;height:20px;stroke-width:2.6}
nav{display:flex;gap:2px;padding:4px;border-radius:var(--r);background:color-mix(in srgb,var(--texte) 4%,transparent);border:1px solid color-mix(in srgb,var(--texte) 6%,transparent)}
nav button{position:relative;background:none;border:0;color:var(--doux);font:500 14px var(--f-texte);padding:8px 15px;border-radius:var(--r);cursor:pointer;display:flex;gap:8px;align-items:center;transition:color .2s,background .2s}
nav button svg{width:16px;height:16px}
nav button:hover{color:var(--texte)}
nav button.on{background:var(--surface2);color:var(--texte);box-shadow:0 1px 0 color-mix(in srgb,var(--texte) 7%,transparent) inset,0 4px 13px color-mix(in srgb,var(--noir) 35%,transparent)}
nav button[data-o="film"].on svg{color:var(--ambre)} nav button[data-o="serie"].on svg{color:var(--violet)} nav button[data-o="jeu"].on svg{color:var(--menthe)} nav button[data-o="gouts"].on svg{color:var(--rouge)}
.compte{margin-left:auto;font-size:12px;color:var(--doux);display:flex;align-items:center;gap:8px;white-space:nowrap}
.compte b{color:var(--texte);font-weight:600;font-variant-numeric:tabular-nums}

main{flex:1;min-height:100vh;width:100%;max-width:1480px;margin:auto;padding:0 var(--marge) 80px}

/* Grande affiche (meilleure reco) */
.scene{position:relative;margin:24px 0 8px;border-radius:var(--r);overflow:hidden;isolation:isolate;min-height:clamp(380px,52vh,560px);display:grid;grid-template-columns:1fr auto;align-items:end;gap:40px;padding:clamp(24px,4vw,56px);border:1px solid color-mix(in srgb,var(--texte) 7%,transparent)}
.scene::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,color-mix(in srgb,var(--noir) 94%,transparent) 0%,color-mix(in srgb,var(--noir) 70%,transparent) 45%,color-mix(in srgb,var(--noir) 15%,transparent) 100%),linear-gradient(0deg,color-mix(in srgb,var(--noir) 60%,transparent),transparent 40%)}
.scene::after,.fiche-tete::after{content:"";position:absolute;inset:-60px;z-index:-2;background:var(--img,none) center/cover;filter:blur(40px) saturate(1.4);opacity:.75}
.scene .affiche:hover{transform:rotate(0) scale(1.02)}
.scene .texte{max-width:640px;display:flex;flex-direction:column;gap:14px;animation:entre .9s var(--sortie) both}
.etiquette{align-self:flex-start;display:flex;align-items:center;gap:8px;font:600 12px var(--f-texte);color:var(--texte);padding:6px 13px 6px 10px;border-radius:var(--r);background:color-mix(in srgb,var(--texte) 8%,transparent);border:1px solid color-mix(in srgb,var(--texte) 10%,transparent);}
a.etiquette{text-decoration:none;transition:border-color .2s}a.etiquette:hover{border-color:var(--ambre)}
.etiquette i{width:8px;height:8px;border-radius:50%;background:var(--dom);box-shadow:0 0 0 3px color-mix(in srgb,var(--dom) 25%,transparent)}
.scene h2{font:600 var(--t-page)/1 var(--f-titre);letter-spacing:-.02em;margin:0;text-wrap:balance}
.scene h2.long{font-size:var(--t-page-long);line-height:1.05}
/* Affiche chargée : on masque le titre de secours (sinon il transparaît derrière les logos PNG) */
.scene h2 span{color:var(--doux);font-size:.5em;letter-spacing:0;margin-left:10px;font-variant-numeric:tabular-nums}
.scene .pq{font-size:16px;color:var(--texte2);max-width:56ch}
.scene .pq b{color:var(--blanc);font-weight:600}
.scene .affiche{display:block;position:relative;width:clamp(200px,24vw,340px);margin-right:clamp(0px,4vw,64px);transform:rotate(2deg);transition:transform .6s var(--sortie);aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;box-shadow:0 30px 60px -18px color-mix(in srgb,var(--noir) 90%,transparent),0 0 0 1px color-mix(in srgb,var(--texte) 8%,transparent);animation:monte 1s .1s var(--sortie) both;background:var(--surface2)}
@keyframes entre{from{opacity:0;transform:translateY(14px)}}
@keyframes monte{from{opacity:0;transform:translateY(24px) scale(.97)}}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:4px 10px;border-radius:var(--r-petit);background:color-mix(in srgb,var(--texte) 7%,transparent);color:var(--texte2);border:1px solid color-mix(in srgb,var(--texte) 6%,transparent)}
.chip.amb{background:transparent;color:var(--doux);border-color:color-mix(in srgb,var(--texte) 14%,transparent)}
.accroche{margin:0;font:600 12px var(--f-texte);color:var(--doux)}
.avis{font-size:12px;color:var(--menthe);font-variant-numeric:tabular-nums}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.bt{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--texte) 12%,transparent);background:color-mix(in srgb,var(--texte) 7%,transparent);color:var(--texte);font:600 14px var(--f-texte);cursor:pointer;text-decoration:none;transition:background .2s,border-color .2s,transform .15s}
.bt svg{width:17px;height:17px}
.bt:hover{background:color-mix(in srgb,var(--texte) 13%,transparent)}
.bt:active{transform:scale(.96)}
.bt.plein{background:var(--texte);color:var(--fond);border-color:transparent}
.bt.plein:hover{background:var(--blanc)}

/* Sections */
.section{margin-top:52px}
.tete{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.tete h3{font:600 var(--t-section)/1.1 var(--f-titre);letter-spacing:-.01em;margin:0}
.tete p{margin:0;color:var(--doux);font-size:14px;max-width:62ch}

/* Grille d'affiches */
.grille{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:26px 18px}
@media(max-width:1200px){.grille{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:900px){.grille{grid-template-columns:repeat(3,minmax(0,1fr))}}
.c{position:relative;display:flex;flex-direction:column;gap:10px;min-width:0}
.c.note{opacity:.3;pointer-events:none;transition:opacity .3s}
.cadre{position:relative;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;background:linear-gradient(155deg,var(--surface3),var(--surface0));box-shadow:0 0 0 1px color-mix(in srgb,var(--texte) 6%,transparent);transition:transform .45s var(--sortie),box-shadow .45s var(--sortie)}
.c:hover .cadre,.c:focus-within .cadre{transform:translateY(-5px);box-shadow:var(--ombre),0 0 0 1px color-mix(in srgb,var(--texte) 12%,transparent)}
.sans-image{position:absolute;inset:0;display:flex;flex-direction:column;gap:13px;padding:16px;overflow:hidden;font:600 20px/1.12 var(--f-titre);color:var(--texte);background:linear-gradient(var(--a,150deg),color-mix(in srgb,var(--dom) 38%,var(--surface2)),var(--surface2) 72%)}
.sans-image span{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.sans-image svg{width:24px;height:24px;flex:none;color:var(--dom)}
.sans-image .filigrane{position:absolute;right:-22%;bottom:-12%;width:85%;height:auto;aspect-ratio:1;color:var(--dom);opacity:.13}
.aff-fiche .sans-image,.scene .affiche .sans-image,.tirage .sans-image{font-size:30px;padding:22px}
.affiche-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.affiche-img.ok{opacity:1}
.pct{position:absolute;z-index:2;top:10px;left:10px;display:flex;align-items:center;gap:6px;font:600 12px var(--f-texte);font-variant-numeric:tabular-nums;color:var(--blanc);padding:4px 9px 4px 8px;border-radius:var(--r-petit);background:color-mix(in srgb,var(--noir) 72%,transparent);border:1px solid color-mix(in srgb,var(--texte) 10%,transparent)}
.pct i{width:7px;height:7px;border-radius:50%;background:var(--dom)}
/* Survol : la raison et les avis apparaissent sur l'affiche */
.voile{position:absolute;inset:0;z-index:1;pointer-events:none;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:14px;background:linear-gradient(transparent 25%,color-mix(in srgb,var(--noir) 94%,transparent) 78%);opacity:0;transition:opacity .3s var(--sortie)}
.c:hover .voile,.c:focus-within .voile{opacity:1}
.voile .mini-act{pointer-events:auto}
.couvre{position:absolute;inset:0;display:block;width:100%;padding:0;border:0;background:none;cursor:pointer}
.couvre:focus-visible{outline:2px solid var(--ambre);outline-offset:2px}
.c .pop-etat{display:block}
/* Avis : 4 choix posés sur l'affiche, du moins bon au meilleur */
.palette{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:8px;background:linear-gradient(transparent,color-mix(in srgb,var(--noir) 92%,transparent) 30%)}
.js .palette{opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .18s var(--sortie),transform .25s var(--sortie),visibility 0s .25s}
.js .ouvert .palette,.js .mode .palette{opacity:1;visibility:visible;transform:none;transition:opacity .18s var(--sortie),transform .25s var(--sortie)}
.palette>*{display:flex;align-items:center;gap:6px;min-height:34px;padding:0 8px;border-radius:var(--r-petit);border:1px solid color-mix(in srgb,var(--texte) 14%,transparent);background:color-mix(in srgb,var(--noir) 55%,transparent);color:var(--blanc);white-space:nowrap;font:600 12px/1.1 var(--f-texte);text-align:left;cursor:pointer;transition:background .15s,color .15s,transform .15s}
.palette svg{width:16px;height:16px;flex:none}
@media(max-width:480px){.palette{gap:3px;padding:5px}.palette>*{min-height:29px;padding:0 6px;gap:5px}.palette svg{width:14px;height:14px}}
.palette button:active{transform:scale(.96)}
.palette button:focus-visible{outline:2px solid var(--ambre);outline-offset:1px}
.palette [data-v="bof"]:hover,[data-n="bof"] .palette [data-v="bof"]{background:var(--trait2)}
.palette [data-v="vu"]:hover,[data-n="vu"] .palette [data-v="vu"]{background:var(--bleu);color:var(--fond)}
.palette [data-v="aime"]:hover,[data-n="aime"] .palette [data-v="aime"]{background:var(--menthe);color:var(--fond)}
.palette [data-v="adore"]:hover,[data-n="adore"] .palette [data-v="adore"],.palette .choisi{background:var(--rouge);color:var(--fond)}
.coche:empty{display:none}
.c .coche,.pop .coche{position:absolute;z-index:2;top:8px;right:8px;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;color:var(--fond);opacity:1;transform:none;border:0}
.coche svg{width:16px;height:16px}
[data-n="aime"] .coche{background:var(--menthe)} [data-n="adore"] .coche{background:var(--rouge);color:var(--fond)} [data-n="vu"] .coche{background:var(--bleu)} [data-n="bof"] .coche{background:var(--trait2);color:var(--blanc)}
[data-n="aime"] .cadre{box-shadow:0 0 0 3px var(--menthe)} [data-n="adore"] .cadre{box-shadow:0 0 0 3px var(--rouge)} [data-n="vu"] .cadre{box-shadow:0 0 0 3px var(--bleu)}
[data-n="bof"] .couvre{opacity:.4}
[data-n="aime"] .pop-etat{color:var(--menthe)} [data-n="adore"] .pop-etat{color:var(--rouge)} [data-n="vu"] .pop-etat{color:var(--bleu)}
#main.entre>*{animation:monte .42s var(--sortie) both}
#main.entre>*:nth-child(2){animation-delay:.05s} #main.entre>*:nth-child(3){animation-delay:.1s}
h1,h2,h3,.mode li b{font-weight:600;letter-spacing:-0.025em;text-wrap:balance}
.accueil h2{color:var(--blanc)}
.accueil h2 em{color:var(--ambre);-webkit-text-fill-color:var(--ambre)}
.legende .titre,.pop-titre{font-weight:500;letter-spacing:-0.01em}
p{text-wrap:pretty}
@media(prefers-reduced-motion:reduce){.palette{transition:none;transform:none}#main.entre>*,.fond-recherche,.fond-recherche .panneau-recherche{animation:none}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a.pct,a.moy{text-decoration:none;color:var(--blanc);transition:background .15s,border-color .15s}
a.pct:hover,a.moy:hover{background:color-mix(in srgb,var(--noir) 95%,transparent);border-color:color-mix(in srgb,var(--texte) 35%,transparent)}
a.chip{text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
a.chip:hover{background:color-mix(in srgb,var(--texte) 14%,transparent);border-color:color-mix(in srgb,var(--texte) 28%,transparent);color:var(--blanc)}
a.accroche{text-decoration:none;align-self:flex-start}
a.accroche:hover{color:var(--texte)}
.pq a,.parce a,.legende span a,.type-fiche a,.score a{color:inherit;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--texte) 28%,transparent);text-underline-offset:3px}
.legende span a,.legende em a{text-decoration:none}
.legende span a:hover,.legende em a:hover{text-decoration:underline}
.pq a:hover,.parce a:hover,.legende span a:hover,.type-fiche a:hover,.score a:hover{color:var(--texte);text-decoration-color:currentColor}
.scene .pq a,.parce a{color:var(--blanc);font-weight:600}
.voile .pq{font-size:12px;line-height:1.4;color:var(--texte2)}
.voile .pq b{color:var(--blanc);font-weight:600}
.mini-act{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.mini-act button,.mini-act a{display:grid;place-items:center;height:36px;border-radius:var(--r-petit);border:1px solid color-mix(in srgb,var(--texte) 14%,transparent);background:color-mix(in srgb,var(--texte) 8%,transparent);color:var(--blanc);cursor:pointer;transition:background .15s,color .15s,transform .15s}
.mini-act button svg,.mini-act a svg{width:16px;height:16px}
.mini-act button,.mini-act a{min-width:0;padding:0}

.cadre,.affiche{cursor:pointer}
.moy{position:absolute;top:10px;right:10px;z-index:2;display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:var(--r);background:color-mix(in srgb,var(--noir) 78%,transparent);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}.moy svg{width:13px;height:13px;color:var(--ambre);fill:var(--ambre)}
.tete .tri{display:inline-flex;margin-top:14px}
.legende .titre{padding:2px 0;font:600 16px/1.25 var(--f-titre);text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.legende .titre:hover,.tirage h3 .titre:hover,.scene h2 a:hover{color:var(--dom)}

/* Fiche d'un titre (page entière, #/film/ID) */
.fiche-tete{position:relative;margin:24px 0 0;border-radius:var(--r);overflow:hidden;isolation:isolate;display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:start;padding:clamp(22px,4vw,52px);border:1px solid color-mix(in srgb,var(--texte) 7%,transparent)}
.fiche-tete::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,color-mix(in srgb,var(--noir) 96%,transparent) 10%,color-mix(in srgb,var(--noir) 60%,transparent))}
.aff-fiche{position:relative;width:clamp(150px,18vw,250px);aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;background:var(--surface2);box-shadow:0 30px 60px -18px color-mix(in srgb,var(--noir) 90%,transparent),0 0 0 1px color-mix(in srgb,var(--texte) 8%,transparent)}
.fiche-tete .texte{display:flex;flex-direction:column;gap:13px;min-width:0}
.fiche-tete h1{font:600 var(--t-page)/1.02 var(--f-titre);letter-spacing:-.02em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.type-fiche{display:block;margin:0;color:var(--doux);font-size:12px;font-weight:600;}
.type-fiche svg{width:16px;height:16px;color:var(--dom);vertical-align:-3px;margin-right:8px}
.autre-titre{margin:0;color:var(--doux)}
.fiche-tete h2,.bloc h2{font:600 12px var(--f-texte);color:var(--doux);margin:4px 0 0}
.bt.on{background:var(--texte);color:var(--fond);border-color:transparent}
.etat{width:100%;margin:2px 0 0;font-size:12px;color:var(--doux)}
.etat b{color:var(--texte)}
.fiche-corps{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr);gap:20px;margin-top:20px;align-items:start}
.fiche-corps>div{display:flex;flex-direction:column;gap:20px;min-width:0}
.bloc{background:var(--surface);border:1px solid var(--trait);border-radius:var(--r);padding:22px;scroll-margin-top:90px}
.bloc h2{margin:0 0 14px}
.bloc p{margin:0 0 10px}
.bloc .aide{color:var(--doux);font-size:14px}
.resume-texte{font-size:16px;line-height:1.65;color:var(--texte2);max-width:70ch}
.score b{font:600 36px var(--f-titre);color:var(--texte);margin-right:6px}
.notes-ext{display:flex;flex-direction:column;gap:13px;margin:0}
.notes-ext div{display:flex;justify-content:space-between;gap:13px;align-items:baseline;border-bottom:1px solid var(--trait);padding-bottom:13px}
.notes-ext div:last-child{border-bottom:0;padding-bottom:0}
.notes-ext dt{color:var(--doux);font-size:14px;font-weight:600}
.notes-ext dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.notes-ext dd small{display:block;font-weight:400;color:var(--pale2);font-size:12px;max-width:26ch}
.ou{display:flex;align-items:center;gap:6px;margin:3px 0 0;font-size:12px;color:var(--doux);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ou svg{width:13px;height:13px;flex:none;color:var(--pale)}
.ou b,.chip.mien{color:var(--menthe);font-weight:600}
.chip.mien{border-color:color-mix(in srgb,var(--menthe) 45%,transparent)}
.boutiques{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
.services{display:flex;flex-wrap:wrap;gap:6px}
.services button{background:none;border:1px solid var(--trait2);color:var(--doux);font:500 12px var(--f-texte);padding:6px 13px;border-radius:var(--r);cursor:pointer}
.services button[aria-pressed="true"]{background:color-mix(in srgb,var(--menthe) 18%,transparent);border-color:var(--menthe);color:var(--texte)}
.listes-menu{width:100%;display:flex;flex-direction:column;gap:8px;margin-top:4px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--trait2)}
.listes-menu label{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.listes-menu input[type=checkbox]{width:18px;height:18px;accent-color:var(--menthe)}
.listes-menu form{display:flex;gap:8px;margin-top:4px}
.listes-menu input[type=text],.nom-liste{flex:1;min-width:0;background:var(--fond);border:1px solid var(--trait2);border-radius:var(--r);padding:9px 13px;color:var(--texte);font:14px var(--f-texte)}
.mes-listes{display:flex;flex-direction:column;gap:10px}
.une-liste{display:flex;align-items:center;gap:13px;padding:13px;border-radius:var(--r);border:1px solid var(--trait);background:var(--surface)}
.mentions{max-width:72ch}.mentions h4{font:600 14px var(--f-texte);margin:22px 0 6px}.mentions p,.mentions li{color:var(--doux);line-height:1.6}.mentions a{color:var(--texte)}
.une-liste .vignettes{display:flex;flex:none}
.une-liste .vignettes i{width:30px;height:45px;border-radius:var(--r);background:color-mix(in srgb,var(--dom) 30%,var(--surface2));box-shadow:0 0 0 2px var(--surface);margin-left:-10px}
.une-liste .vignettes i:first-child{margin-left:0}
.une-liste a{flex:1;min-width:0;color:var(--texte);text-decoration:none;font-weight:600}
.une-liste a small{display:block;font-weight:400;color:var(--doux);font-size:12px}
.dans-liste{position:relative;min-width:0}
.retirer{position:absolute;z-index:3;top:10px;right:10px;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;border:1px solid color-mix(in srgb,var(--texte) 20%,transparent);background:color-mix(in srgb,var(--noir) 80%,transparent);color:var(--blanc);cursor:pointer;font-size:16px}
.nd{color:var(--pale2);font-weight:400}  /* --pale manque de contraste sur --surface (4,4:1) */
.liens-ext{display:flex;flex-wrap:wrap;gap:8px}
#proches{scroll-margin-top:90px}
@media(max-width:900px){.fiche-corps{grid-template-columns:1fr}}
@media(max-width:760px){.bloc,#proches{scroll-margin-top:130px}.fiche-tete{grid-template-columns:1fr;align-items:start;padding-top:32px}.aff-fiche{width:min(200px,56vw);justify-self:center}.fiche-tete .actions .bt{padding:10px 13px}}

<script>
let onglet = "film", data = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ico = n => `<svg aria-hidden="true"><use href="#${n}"/></svg>`;
const NOM = {film:"Film", serie:"Série", jeu:"Jeu"};
const ICONE = {film:"film", serie:"tv", jeu:"manette"};
const TEXTE = {adore:"J'adore", aime:"J'aime", regarde:"Regardé", vu:"Sans plus", bof:"Non merci", deteste:"Détesté"};
const VERBE = {film:"vu", serie:"vu", jeu:"joué"};

const poster = (url, corps) => fetch(url,{method:"POST",headers:{"X-Recos":"1"},body:JSON.stringify(corps)});
const json = async url => (await fetch(url)).json();
// Même page pour les deux versions : serveur local (recos.py) ou site sans serveur (moteur.js, profil dans le navigateur)
const WEB = typeof Moteur !== "undefined";
const api = WEB ? {
 recos: async () => Moteur.recos(), gouts: async () => Moteur.gouts(), cherche: async q => Moteur.cherche(q),
 noter: async (id, note) => Moteur.noter(id, note),
 fiche: async id => Moteur.fiche(id), liste: async q => Moteur.liste(q), titres: async ids => Moteur.titres(ids),
 importer: async (nom, texte) => { try { return Moteur.importer(texte); } catch (e) { return {erreur: e.message}; } },
} : {
 recos: () => json("/api/recos"), gouts: () => json("/api/gouts"), cherche: q => json("/api/cherche?q="+encodeURIComponent(q)),
 noter: (id, note) => poster("/api/note",{id,note}),
 fiche: id => json("/api/fiche?id="+encodeURIComponent(id)),
 titres: ids => json("/api/titres?ids="+ids.map(encodeURIComponent).join(".")),
 liste: q => json(`/api/liste?themes=${encodeURIComponent((q.themes || []).join("|"))}&annee=${q.annee || ""}&tri=${q.tri || ""}`),
 importer: async (nom, texte) => (await poster("/api/import",{nom, texte})).json(),
};
function toast(t){const e=$("#toast");e.innerHTML=ico("ok")+esc(t);e.classList.add("v");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("v"),1900)}
// Wikipédia dans la langue affichée (r.wiki = article anglais, connu depuis Wikidata)
function lien(r){return r.steam?`https://store.steampowered.com/app/${r.steam}`:enAnglais()?(r.wiki?`https://en.wikipedia.org/wiki/${r.wiki}`:`https://en.wikipedia.org/wiki/Special:Search/${encodeURIComponent(r.titre)}`):`https://fr.wikipedia.org/wiki/Special:Search/${encodeURIComponent(r.titre)}`}
// Vraie affiche (jaquette verticale Steam pour les jeux), posée sur une couverture dessinée qui sert de repli
// tant qu'elle charge ou si elle manque : icône du support, titre, teinte du support.
const TEINTE = {film:"var(--ambre)", serie:"var(--violet)", jeu:"var(--menthe)"};
// Variation stable par titre (angle du dégradé), pour que deux couvertures voisines ne se ressemblent pas
const angle = id => 120 + [...id].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 997, 7) % 100;
const visuel = r => r.dom === "jeu" && r.steam ? `https://cdn.akamai.steamstatic.com/steam/apps/${r.steam}/library_600x900.jpg` : r.image;
const repli = r => r.dom === "jeu" && r.image ? `this.onerror=()=>this.remove();this.src='${esc(r.image)}'` : "this.remove()";
const affiche = (r, charge = "lazy") => visuel(r) ? `<img class="affiche-img" src="${esc(visuel(r))}" loading="${charge}" alt="" onload="this.classList.add('ok')" onerror="${repli(r)}">` : "";
const couverture = (r, charge) => `<div class="sans-image" style="--dom:${TEINTE[r.dom]};--a:${angle(r.id)}deg">${ico(ICONE[r.dom])}<span>${esc(r.titre)}</span><svg class="filigrane" aria-hidden="true"><use href="#${ICONE[r.dom]}"/></svg></div>${affiche(r, charge)}`;
// Ambiances à la Letterboxd : des combinaisons de thèmes décrites en une phrase (affichage seulement)
const AMBIANCES = [
 [["Guerre","Historique"], "Batailles historiques et héroïsme épique"],
 [["Polar, gangsters","Sombre, adulte"], "Polars noirs et poisseux"],
 [["Thriller, mystère","Polar, gangsters"], "Enquêtes tendues à rebondissements"],
 [["Horreur","Sombre, adulte"], "Horreur crue et dérangeante"],
 [["Horreur","Survie"], "Survivre la peur au ventre"],
 [["Zombies"], "Morts-vivants et fin du monde"],
 [["Science-fiction","Cyberpunk, dystopie"], "Futurs sombres et sociétés sous contrôle"],
 [["Science-fiction","Aventure"], "Odyssées spatiales et mondes inconnus"],
 [["Fantasy","Sombre, adulte"], "Fantasy sombre, magie et sang"],
 [["Fantasy","Animation, famille"], "Contes merveilleux pour tous"],
 [["Fantasy","Aventure"], "Quêtes épiques en terres de légende"],
 [["Super-héros"], "Héros masqués et justiciers"],
 [["Vengeance, vigilante"], "Vengeance froide et justice personnelle"],
 [["Espionnage, infiltration"], "Espions, doubles jeux et infiltration"],
 [["Western"], "Grands espaces et hors-la-loi"],
 [["Post-apocalyptique"], "Survivre dans un monde en ruines"],

// ---------- Où regarder, où jouer (disponibilites.py) ----------
const BOUTIQUES = {steam: ["Steam", id => `https://store.steampowered.com/app/${id}`], gog: ["GOG", id => `https://www.gog.com/${encodeURI(id)}`],

// Plateformes d'un jeu : celles de Wikidata, complétées par les boutiques (une fiche PlayStation Store = jouable sur PlayStation)
const plateformesJeu = r => { const p = [...(r.plateformes || [])];
 if (r.boutiques?.ps && !p.some(x => x.startsWith("PS"))) p.push("PlayStation");
 if (r.boutiques?.eshop && !p.some(x => x.startsWith("Switch"))) p.push("Switch");

const mesServices = () => { try { return JSON.parse(localStorage.getItem("tastebridge-services")) || []; } catch { return []; } };
const chezMoi = r => WEB ? Moteur.chezMoi(r) : [];
// Ligne courte sous chaque carte : où regarder ou jouer, en vert si c'est sur un de tes services

// Filtres des recos : une pastille par critère, cumulables
const FILTRES = {court: ["Court", r => r.duree && (r.dom === "jeu" ? r.duree <= 10 : r.duree <= 100)], gratuit: ["Gratuit", r => r.gratuit, "jeu"],
 plusieurs: ["À plusieurs", r => r.modes, "jeu"], ecran: ["Même écran", r => r.modes?.includes("ecran"), "jeu"]};
let filtresOn = new Set();
const garde = r => [...filtresOn].every(k => FILTRES[k][1](r));
function basculerFiltre(k){ filtresOn.has(k) ? filtresOn.delete(k) : filtresOn.add(k); rendre(); }
const barreFiltres = dom => `<div class="filtres">${Object.entries(FILTRES).filter(([, f]) => !f[2] || f[2] === dom).filter(([k]) => k !== "court" || dom !== "serie")
 .map(([k, [nom]]) => `<button class="${filtresOn.has(k) ? "on" : ""}" aria-pressed="${filtresOn.has(k)}" onclick="basculerFiltre('${k}')">${k === "court" ? ico("horloge") : ""}${nom}</button>`).join("")}</div>`;
function ouCourt(r){
 const liste = r.dom === "jeu" ? plateformesJeu(r) : r.dispo?.[paysOffres()]?.abo || [];
 if (!liste.length) return "";
 const moi = chezMoi(r).length > 0;
 return `<p class="ou">${ico("ecran")}${moi ? "<b>Chez toi</b> : " : ""}${liste.slice(0, 3).map(esc).join(", ")}</p>`;
}
function blocOu(r){
 // Une offre ou une plateforme que tu as (réglage « Mes services ») ressort en vert
 const marque = n => WEB && Moteur.chezMoi(r.dom === "jeu" ? {dom: "jeu", plateformes: [n]} : {dom: r.dom, dispo: {[Moteur.pays()]: {abo: [n]}}}).length ? " mien" : "";
 if (r.dom === "jeu") {
  const pl = plateformesJeu(r);

   <div class="boutiques">${b.map(([k, id]) => `<a class="bt" href="${esc(BOUTIQUES[k][1](id))}" target="_blank" rel="noopener">${ico("lien")}${BOUTIQUES[k][0]}</a>`).join("")}</div>
   <p class="aide">Plateformes et boutiques : Wikidata (incomplet, surtout pour les consoles).</p>`;
 }
 const jw = enAnglais() ? `https://www.justwatch.com/us/search?q=${encodeURIComponent(r.titre)}` : `https://www.justwatch.com/fr/recherche?q=${encodeURIComponent(r.titre)}`;

function reglerServices(k){

 try { localStorage.setItem("tastebridge-services", JSON.stringify(l)); } catch {}

// Fiche d'une œuvre : une page entière à son adresse (#/film/ID), voir fichePage()
const lienFiche = (r, ancre) => `#/${r.dom}/${encodeURIComponent(r.id)}${ancre ? "/" + ancre : ""}`;
// Moyennes des avis de tout le monde (compte.js remplit window.NOTES : id -> [moyenne, nombre])
const etoile = r => { const n = window.NOTES?.[r.id]; return n ? `<a class="moy" href="${lienFiche(r, "avis")}" title="Voir les avis"><span class="vh">Moyenne des visiteurs :</span>${ico("etoile")}${decimal(n[0])}</a>` : ""; };
// Tri : des recos (onglets) et des listes thème / ambiance / année. Un titre sans la donnée passe après, jamais de note inventée.
// Note critique : Metacritic, sinon Rotten Tomatoes, sinon avis Steam (mêmes règles dans moteur.js et recos.py)
const noteCritique = r => r.metacritic ?? r.rt ?? (r.avis ? parseInt(r.avis) : null);
const CLES_TRI = {critique: noteCritique, recents: r => r.annee <= new Date().getFullYear() ? r.annee : null, tendance: r => WEB ? Moteur.tendance(r.id) || null : null,
 note: r => { const n = window.NOTES?.[r.id]; return n ? n[0] + n[1] / 1e6 : null; }};
const TRIS = {toi: "Pour toi", acclames: "Acclamés", critique: "Critique", recents: "Récents", tendance: "Tendance", note: "Visiteurs"};
const AIDE_TRI = {critique: "Metacritic, sinon Rotten Tomatoes, sinon avis Steam", tendance: "Les plus lus sur Wikipédia ou joués sur Steam cette semaine", note: "Moyenne des avis des visiteurs"};
let tri = "toi"; try { tri = localStorage.getItem("tastebridge-tri") || "toi"; } catch {}
if (!(tri in TRIS) || tri === "acclames") tri = "toi";
const trier = l => { const f = CLES_TRI[tri]; if (!f) return l;
 return l.map((r, k) => [f(r) ?? -Infinity, k, r]).sort((a, b) => b[0] - a[0] || a[1] - b[1]).map(x => x[2]); };
function choisirTri(k){ tri = k; try { localStorage.setItem("tastebridge-tri", k); } catch {} rendre(); }

const barreTri = () => segmentsTri(WEB ? ["toi", "critique", "recents", "tendance", "note"] : ["toi", "critique", "recents"], tri, "choisirTri");
addEventListener("notes-moyennes", () => {

// Résumé : API REST de Wikipédia (sans clé), dans la langue affichée ; repli sur l'anglais si pas d'article français
async function resumeWiki(r, recaler){
 const z = $("#resume .contenu");
 const fin = html => { if (z.isConnected) { z.innerHTML = html; recaler(); } };
 try {
  let langue = enAnglais() ? "en" : "fr", page = enAnglais() ? r.wiki : null, repli = false;
  // Article français : lien de langue de l'article anglais ; si ce détour échoue, on garde le résumé anglais
  if (!enAnglais() && r.wiki) try {
   const l = await (await fetch(`https://en.wikipedia.org/w/rest.php/v1/page/${r.wiki}/links/language`)).json();
   const fr = Array.isArray(l) && l.find(x => x.code === "fr");
   if (fr?.key) page = encodeURIComponent(fr.key);
  } catch {}
  if (!page && r.wiki) { langue = "en"; page = r.wiki; repli = !enAnglais(); }
  if (!page) return fin(`<p class="aide">Résumé non disponible.</p>`);
  const rep = await fetch(`https://${langue}.wikipedia.org/api/rest_v1/page/summary/${page}`);
  if (rep.status === 404) return fin(`<p class="aide">Résumé non disponible.</p>`);
  if (!rep.ok) throw new Error(rep.status);
  const j = await rep.json(), url = j.content_urls?.desktop?.page;
  if (!j.extract) return fin(`<p class="aide">Résumé non disponible.</p>`);
  fin(`<p class="resume-texte" lang="${langue}">${esc(j.extract)}</p>${repli ? `<p class="aide">Pas d'article en français : résumé de Wikipédia en anglais.</p>` : ""}
   ${/^https:\/\/[a-z]+\.wikipedia\.org\//.test(url || "") ? `<a href="${esc(url)}" target="_blank" rel="noopener">Lire l'article sur Wikipédia</a>` : ""}
   <p class="aide">Texte extrait de Wikipédia, par ses contributeurs, sous licence <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.fr" target="_blank" rel="noopener">CC BY-SA 4.0</a>.</p>`);
 } catch { fin(`<p class="aide">Résumé indisponible pour le moment : Wikipédia ne répond pas.</p>`); }
}

 if (!q){ m.innerHTML = `<section class="section">${vide("Rien à afficher pour cette liste.")}</section>`; return appliquerDefile(); }
 m.innerHTML = `<section class="section"><div class="grille">${'<div class="squelette"></div>'.repeat(12)}</div></section>`;
 const tris = ["acclames", "critique", ...(type === "annee" ? [] : ["recents"]), ...(WEB ? ["tendance"] : [])];
 if (!tris.includes(triListe)) triListe = "acclames";
 let res = null; try { res = await api.liste({...q, tri: triListe}); } catch {}
 if (vue !== "liste" || location.hash !== ici) return;
 if (!res){ m.innerHTML = `<section class="section">${vide("Liste indisponible pour le moment.")}</section>`; return appliquerDefile(); }
 m.innerHTML = `<section class="section"><div class="tete"><div><p class="accroche">${{theme: "Thème", ambiance: "Ambiance", annee: "Année"}[type]}</p><h3>${esc(v)}</h3></div>
  <p><b>${nombre(res.total)}</b> titres, tous supports confondus, ${PHRASE_TRI[triListe]}${res.total > res.titres.length ? `<span> Les ${res.titres.length} premiers sont affichés.</span>` : ""}</p>${segmentsTri(tris, triListe, "choisirTriListe")}</div>
  ${res.titres.length ? `<div class="grille">${res.titres.map(carte).join("")}</div>` : vide("Aucun titre dans le catalogue.")}</section>`;
 appliquerDefile();
}

// ---------- Listes mixtes (films, séries, jeux), partageables par un simple lien, sans compte ----------
// Gardées dans ce navigateur ; le lien contient le titre et les identifiants : #/l/Ma liste/Q62730.steam292030
const lireListes = () => { try { return JSON.parse(localStorage.getItem("tastebridge-listes")) || []; } catch { return []; } };
// Connecté, compte.js envoie aussi les listes au compte (événement « listes-change »)
const ecrireListes = l => { try { localStorage.setItem("tastebridge-listes", JSON.stringify(l)); } catch {} dispatchEvent(new CustomEvent("listes-change")); };
const lienPartage = l => `#/l/${encodeURIComponent(l.titre)}/${l.items.map(encodeURIComponent).join(".")}`;
const urlPartage = l => location.href.split("#")[0] + lienPartage(l);
// « 2 films, 1 série, 1 jeu »
function resumeListe(titres){
 const n = d => titres.filter(x => x.dom === d).length, en = enAnglais();
 const mots = {film: en ? ["movie", "movies"] : ["film", "films"], serie: en ? ["show", "shows"] : ["série", "séries"], jeu: en ? ["game", "games"] : ["jeu", "jeux"]};
 return ["film", "serie", "jeu"].filter(n).map(d => `${n(d)} ${mots[d][n(d) > 1 ? 1 : 0]}`).join(", ") || (en ? "empty" : "vide");
}
function menuListe(bouton, id){
 const m = $("#menu-liste"), ouvert = m.hidden;
 m.hidden = !ouvert; bouton.setAttribute("aria-expanded", ouvert);
 if (!ouvert) return;
 const listes = lireListes();
 m.innerHTML = `<div class="listes-menu">${listes.map((l, k) => `<label><input type="checkbox" ${l.items.includes(id) ? "checked" : ""} onchange="basculerDansListe(${k}, '${id}', this.checked)">${esc(l.titre)}</label>`).join("")}
  <form onsubmit="event.preventDefault(); nouvelleListe(this.nom.value, '${id}')"><input type="text" name="nom" maxlength="60" placeholder="Nouvelle liste : Ma liste d'automne" aria-label="Nom de la nouvelle liste" required><button class="bt plein">Créer</button></form></div>`;
}
function basculerDansListe(k, id, dedans){
 const l = lireListes(); if (!l[k]) return;
 l[k].items = l[k].items.filter(x => x !== id); if (dedans) l[k].items.push(id);
 ecrireListes(l); toast(dedans ? `Ajouté à « ${l[k].titre} »` : "Retiré de la liste");
}
function nouvelleListe(nom, id){
 nom = nom.trim(); if (!nom) return;
 const l = lireListes(); l.push({titre: nom, items: id ? [id] : [], cree: Date.now()}); ecrireListes(l);
 toast(`Liste « ${nom} » créée`); const b = $("#menu-liste"); if (b) { b.hidden = true; menuListe($('[aria-controls="menu-liste"]'), id); }
}
async function partagerListe(l){
 const url = urlPartage(l);
 try { if (navigator.share) { await navigator.share({title: l.titre, text: `${l.titre} · Pontil`, url}); return; } } catch (e) { if (e.name === "AbortError") return; }
 try { await navigator.clipboard.writeText(url); toast("Lien copié"); } catch { prompt("Copie ce lien :", url); }
}

async function mesListes(){
 vue = "listes"; marquerNav("gouts");
 const m = $("#main"), listes = lireListes(); m.className = "";
 const tous = await api.titres([...new Set(listes.flatMap(l => l.items))]), par = Object.fromEntries(tous.map(x => [x.id, x]));
 m.innerHTML = `<section class="section"><div class="tete"><div><h3>Mes listes</h3></div><p>Des films, des séries et des jeux dans une même liste. Partage-la d'un lien, sans compte.</p></div>
  <form class="champ-liste" onsubmit="event.preventDefault(); nouvelleListe(this.nom.value); mesListes()" style="display:flex;gap:8px;margin-bottom:16px">
   <input class="nom-liste" name="nom" maxlength="60" placeholder="Nouvelle liste : Ma liste d'automne" aria-label="Nom de la nouvelle liste" required><button class="bt plein">Créer</button></form>
  ${listes.length ? `<div class="mes-listes">${listes.map((l, k) => { const t = l.items.map(i => par[i]).filter(Boolean);
   return `<div class="une-liste"><span class="vignettes" aria-hidden="true">${t.slice(0, 4).map(x => `<i style="--dom:${TEINTE[x.dom]};${visuel(x) ? `background:center/cover url('${esc(visuel(x))}')` : ""}"></i>`).join("")}</span>

    <button class="bt" onclick="if(confirm('Supprimer cette liste ?')){const l=lireListes();l.splice(${k},1);ecrireListes(l);mesListes()}" aria-label="Supprimer ${esc(l.titre)}">${ico("corbeille")}</button></div>`; }).join("")}</div>`
   : `<div class="liste-vide"><div class="eventail" aria-hidden="true">${(() => { try { return ["film", "serie", "jeu"].flatMap(d => Moteur.populaires(d, 2)).slice(0, 5).map(x => `<i>${couverture(x)}</i>`).join(""); } catch { return ""; } })()}</div>

async function listePartagee(titre, ids){
 vue = "liste-partagee"; marquerNav(null);
 const m = $("#main"), ici = location.hash; m.className = "";
 m.innerHTML = `<section class="section"><div class="grille">${'<div class="squelette"></div>'.repeat(6)}</div></section>`;
 let t = null; try { t = await api.titres(ids); } catch {}
 if (location.hash !== ici) return;
 if (!t) { m.innerHTML = `<section class="section"><div class="vide">${ico("liste")}<span>Liste indisponible pour le moment.</span></div></section>`; return; }
 const l = {titre, items: t.map(x => x.id)}, k = lireListes().findIndex(x => x.titre === titre && x.items.join() === l.items.join());
 m.innerHTML = `<section class="section"><div class="tete"><div><p class="accroche">Liste</p><h3>${esc(titre)}</h3><p>${resumeListe(t)}</p></div>
  <div class="actions"><button class="bt plein" id="partager">${ico("partage")}Partager</button>${k < 0 ? `<button class="bt" id="garder">${ico("liste")}Garder dans mes listes</button>` : ""}</div></div>
  ${t.length ? `<div class="grille">${t.map(x => `<div class="dans-liste">${k >= 0 ? `<button class="retirer" aria-label="Retirer ${esc(x.titre)}" onclick="retirerDeListe(${k}, '${x.id}')">×</button>` : ""}${carte(x)}</div>`).join("")}</div>`
   : `<div class="vide">${ico("liste")}<span>Cette liste est vide. Ajoute des titres depuis leur fiche.</span></div>`}</section>`;
 $("#partager").onclick = () => partagerListe(l);
 if ($("#garder")) $("#garder").onclick = () => { const ls = lireListes(); ls.push({...l, cree: Date.now()}); ecrireListes(ls); toast("Liste gardée"); listePartagee(titre, ids); };
 appliquerDefile();
}
function retirerDeListe(k, id){ const l = lireListes(); if (!l[k]) return; l[k].items = l[k].items.filter(x => x !== id); ecrireListes(l); history.replaceState(null, "", lienPartage(l)); router(); }

// ---------- Navigation par adresse : #/film, #/serie, #/jeu, #/gouts, #/film/ID[/ancre] ----------
// Retour et Suivant du navigateur marchent, chaque page est partageable, la position est retrouvée au retour.
const ONGLETS = ["film", "serie", "jeu", "gouts"], DEFILE = {};
let vue = "", interne = false, interneAncre = false, defile = null, titrePage = "";
try { history.scrollRestoration = "manual"; } catch {}
// Un clic sur un lien interne (même onglet) ouvre la page en haut ; Retour, Suivant ou un lien collé retrouvent la position
addEventListener("click", e => { const a = e.target.closest?.('a[href^="#/"]'); if (a && !e.defaultPrevented && e.button === 0 && !e.ctrlKey && !e.metaKey && !e.shiftKey) interne = true; }, true);
addEventListener("scroll", () => { DEFILE[location.hash] = scrollY; }, {passive: true});
function appliquerDefile(){ if (defile !== null) { scrollTo(0, defile); defile = null; } }
function marquerNav(o){ document.querySelectorAll("nav button").forEach(x => { x.classList.toggle("on", x.dataset.o === o); x.setAttribute("aria-current", x.dataset.o === o ? "page" : "false"); }); }
function fermerCalques(){ document.querySelectorAll(".fond-recherche,.voile-compte").forEach(e => e.remove()); document.body.style.overflow = ""; }
function router(){
 const [, a = "", b, c] = location.hash.split("/");
 titrePage ||= document.title;
 fermerCalques();
 interneAncre = interne; defile = interne ? 0 : (DEFILE[location.hash] ?? 0); interne = false;
 if (b && NOM[a]) return fichePage(a, decodeURIComponent(b), c);
 document.title = titrePage;
 if (["theme", "ambiance", "annee"].includes(a) && b) return listePage(a, decodeURIComponent(b));
 if (a === "l" && b) return listePartagee(decodeURIComponent(b), (c || "").split(".").filter(Boolean).map(decodeURIComponent));
 if (a === "listes") return mesListes();
 if (a === "mentions") return mentions();
 if (a === "accueil") { marquerNav(null); accueil(); return appliquerDefile(); }
 if (ONGLETS.includes(a)) { vue = "onglet"; onglet = a; marquerNav(a); return rendre(); }
 if (WEB && nbNotes < 5) { marquerNav(null); accueil(); return appliquerDefile(); }  // premier passage
 history.replaceState(null, "", "#/film"); router();
}
function aller(o){ interne = true; if (location.hash === "#/" + o) router(); else location.hash = "#/" + o; }
addEventListener("hashchange", router);
$("#nav").onclick = e => { const b = e.target.closest("button"); if (b) aller(b.dataset.o); };
if (WEB) {
 // Premier passage : le texte d'accueil s'affiche tout de suite, le catalogue (1,3 Mo) arrive pendant ce temps
 let n0 = 0; try { n0 = Object.keys(JSON.parse(localStorage.getItem("tastebridge-profil"))?.notes || {}).length; } catch {}
 if (n0 < 5 && !/^#\/./.test(location.hash)) accueil(false);
 Moteur.charger().then(async () => { await compter(); router(); });
}
else { setInterval(()=>fetch("/api/ping").catch(()=>{}), 10000); compter().then(router); }
</script>
