<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Pontil : statistiques</title>
<style>
@font-face{font-family:Geist;src:url(polices/geist-latin.woff2) format("woff2");font-weight:100 900}
:root{--fond:#000;--surface:#181818;--surface2:#1F1F1F;--trait:#272727;--texte:#F2F2F2;--doux:#B4B4B4;--pale:#9B9B9B;--ambre:#E8A33D;--violet:#A99BF0;--menthe:#5CC9A0;--rouge:#E5706B;--r:12px}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;background:var(--fond);color:var(--texte);font:15px/1.5 Geist,system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:32px 16px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}
.logo{display:flex;align-items:center;gap:10px;font:600 22px/1 Geist;color:var(--texte);text-decoration:none}
.logo b{display:grid;place-items:center;width:32px;height:32px;border-radius:var(--r);background:var(--ambre)}
.logo svg{width:20px;height:20px}
#maj{color:var(--pale);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--trait);border-radius:var(--r);padding:18px 20px}
.kpi span{display:block;color:var(--doux);font-size:13px}
.kpi b{display:block;font:600 40px/1.1 Geist;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:6px}
.kpi small{color:var(--pale);font-size:13px}
.bloc{background:var(--surface);border:1px solid var(--trait);border-radius:var(--r);padding:20px;margin-top:12px}
.bloc h2{font:600 16px/1.2 Geist;margin:0 0 14px}
.deux{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}
.deux .bloc{margin-top:0}
#courbe{width:100%;height:200px;display:block}
.ligne{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--trait)}
.ligne:first-of-type{border-top:0}
.ligne b{font-variant-numeric:tabular-nums}
.vide{color:var(--pale)}
#porte{text-align:center;padding:80px 16px;color:var(--doux)}
#porte a{color:var(--ambre)}
a:focus-visible{outline:2px solid var(--ambre);outline-offset:2px}
</style>
</head>
<body>
<main>
 <header><a class="logo" href="./"><b><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6v12M20 6v12M4 10c3 0 5 3 8 3s5-3 8-3"/></svg></b>Statistiques</a><span id="maj"></span></header>
 <div id="contenu"><p id="porte">Chargement...</p></div>
</main>
<script src="vendor/supabase.js"></script>
<script>
// Tableau de bord privé : la fonction SQL stats() ne répond qu'au compte du propriétaire (supabase/stats.sql)
const sb = supabase.createClient("https://ryvqymggtvosrijdxmzg.supabase.co", "sb_publishable_HzOqlGPtg9qhTVESavdHGw_ZLKp95f4");
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const nb = n => Number(n).toLocaleString("fr-FR");
let titres = {};

function liste(rows, nom = x => x) {
  return rows.length ? rows.map(([k, n]) => `<div class="ligne"><span>${esc(nom(k))}</span><b>${nb(n)}</b></div>`).join("") : '<p class="vide">Rien pour l\'instant.</p>';
}
// Barres des 30 derniers jours (visites), jours vides compris
function courbe(parJour) {
  const m = new Map(parJour.map(([j, n]) => [j, n])), jours = [];
  for (let i = 29; i >= 0; i--) { const d = new Date(Date.now() - i * 864e5); jours.push(d.toLocaleDateString("sv-SE", {timeZone: "Europe/Paris"})); }
  const max = Math.max(1, ...jours.map(j => m.get(j) || 0)), L = 1000, H = 200, l = L / 30;
  const barres = jours.map((j, i) => { const n = m.get(j) || 0, h = Math.max(n ? 4 : 1, n / max * (H - 30));
    return `<rect x="${i * l + 3}" y="${H - 20 - h}" width="${l - 6}" height="${h}" rx="3" fill="${n ? "#E8A33D" : "#272727"}"><title>${j} : ${n} visite(s)</title></rect>`; }).join("");
  const ax = [0, 14, 29].map(i => `<text x="${i * l + l / 2}" y="${H - 4}" fill="#9B9B9B" font-size="12" text-anchor="middle">${jours[i].slice(5).split("-").reverse().join("/")}</text>`).join("");
  return `<svg id="courbe" viewBox="0 0 ${L} ${H}" preserveAspectRatio="none" role="img" aria-label="Visites des 30 derniers jours">${barres}${ax}</svg>`;
}

async function charger() {
  const {data: {session}} = await sb.auth.getSession();
  if (!session) { $("#contenu").innerHTML = '<p id="porte">Connecte-toi d\'abord sur <a href="./">pontil.fr</a>, puis reviens ici.</p>'; return; }
  const {data: s, error} = await sb.rpc("stats");
  if (error) { $("#contenu").innerHTML = '<p id="porte">Page réservée au propriétaire du site.</p>'; return; }
  try { const c = await (await fetch("catalogue.json")).json(); for (const [id, it] of Object.entries(c)) titres[id] = it.titre || it.t || id; } catch (e) { /* noms bruts */ }
  $("#maj").textContent = "Mis à jour " + new Date().toLocaleTimeString("fr-FR", {hour: "2-digit", minute: "2-digit"});
  $("#contenu").innerHTML = `
  <div class="kpis">
   <div class="kpi"><span>Visites aujourd'hui</span><b>${nb(s.visites_jour)}</b><small>${nb(s.visites_7j)} sur 7 jours</small></div>
   <div class="kpi"><span>Visites au total</span><b>${nb(s.visites)}</b><small>${s.visites ? Math.round(s.mobile / s.visites * 100) : 0} % sur téléphone</small></div>
   <div class="kpi"><span>Comptes créés</span><b>${nb(s.comptes)}</b><small>${nb(s.comptes_confirmes)} confirmés, ${nb(s.comptes_7j)} cette semaine</small></div>
   <div class="kpi"><span>Avis publiés</span><b>${nb(s.avis)}</b><small>${nb(s.profils)} profils synchronisés</small></div>
  </div>
  <div class="bloc"><h2>Visites des 30 derniers jours</h2>${courbe(s.par_jour)}</div>
  <div class="deux" style="margin-top:12px">
   <div class="bloc"><h2>D'où viennent les visiteurs</h2>${liste(s.origines)}</div>
   <div class="bloc"><h2>Page d'arrivée</h2>${liste(s.pages)}</div>
  </div>
  <div class="bloc"><h2>Titres les plus notés par les comptes</h2>${liste(s.notes, k => titres[k] || k)}</div>`;
}
charger();
</script>
</body>
</html>
